name: atom

volumes:
  elasticsearch_data:
  percona_data:
  composer_deps:
  npm_deps:

networks:
  default:
  lab-network:
    external: true   # crear una sola vez: docker network create lab-network

services:
  atom:
    build: ..
    env_file: etc/environment
    networks:
      - default
    volumes:
      - composer_deps:/atom/src/vendor/composer
      - npm_deps:/atom/src/node_modules
      - ..:/atom/src:rw

  atom_worker:
    build: ..
    command: worker
    env_file: etc/environment
    depends_on:
      - gearmand
      - percona
    restart: on-failure:5
    networks:
      - default
    volumes:
      - composer_deps:/atom/src/vendor/composer
      - npm_deps:/atom/src/node_modules
      - ..:/atom/src:rw

  nginx:
    image: nginx:latest
    container_name: atom-nginx
    volumes:
      - composer_deps:/atom/src/vendor/composer
      - npm_deps:/atom/src/node_modules
      - ..:/atom/src:ro
      - ./etc/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - default      # para hablar con atom, php-fpm, etc.
      - lab-network   # para que tu nginx principal (lab-proxy) lo alcance
   

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:7.10.2
    env_file: etc/environment
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - default

  percona:
    image: percona:8.0   
    env_file: etc/environment
    volumes:
      - percona_data:/var/lib/mysql:rw
      - ./etc/mysql/mysqld.cnf:/etc/my.cnf.d/mysqld.cnf:ro
    networks:
      - default

  memcached:
    image: memcached
    command: -p 11211 -m 128 -u memcache
    networks:
      - default

  gearmand:
    image: artefactual/gearmand
    networks:
      - default

