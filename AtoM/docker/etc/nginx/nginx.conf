user nginx;
worker_processes 1;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;
  sendfile on;
  keepalive_timeout 65;
  gzip on;

  upstream atom {
    server atom:9000;
  }

  # AtoM se sirve bajo el prefijo /atom/ (el lab-proxy reenvía la URI
  # completa). El prefijo se le comunica a Symfony vía SCRIPT_NAME
  # (/atom/index.php) para que genere enlaces y assets con /atom/.
  #
  # IMPORTANTE: el orden de las locations regex es significativo.
  server {
    listen 80;
    root /atom/src;
    server_name _;
    client_max_body_size 72M;

    location = /atom {
      return 301 /atom/;
    }

    # Home: /atom/
    location = /atom/ {
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/index.php;
      fastcgi_param SCRIPT_NAME /atom/index.php;
      fastcgi_pass atom;
    }

    # Front controller: /atom/index.php(/...)
    location ~ ^/atom/index\.php(/|$) {
      include /etc/nginx/fastcgi_params;
      fastcgi_split_path_info ^(.+?\.php)(/.*)$;
      fastcgi_param SCRIPT_FILENAME $document_root/index.php;
      fastcgi_param SCRIPT_NAME /atom/index.php;
      fastcgi_pass atom;
    }

    # Descarga de objetos digitales: /atom/uploads/r/(...)
    location ~* ^/atom/uploads/r/(.*)/conf/ { }
    location ~* ^/atom/uploads/r/(.*)$ {
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/index.php;
      fastcgi_param SCRIPT_NAME /atom/index.php;
      fastcgi_pass atom;
    }

    # Ficheros privados servidos por X-Accel-Redirect.
    # Debe ir ANTES de la ubicación de estáticos para que nunca sea
    # alcanzable directamente desde el cliente ("internal").
    location ~ ^/atom/private/(.+)$ {
      internal;
      alias /atom/src/$1;
    }

    # Seguridad (antes de los estáticos)
    location ~ /\. {
      deny all;
      return 404;
    }
    location ~* (\.yml|\.ini|\.tmpl)$ {
      deny all;
      return 404;
    }
    location ~* \.php$ {
      deny all;
      return 404;
    }

    # Estáticos y fallback al front controller: /atom/<recurso>
    location ~ ^/atom/(?<atom_static>.+)$ {
      try_files /$atom_static /atom/index.php?$args;
    }

    # Todo lo que no llegue con el prefijo /atom/ se rechaza
    location / {
      return 404;
    }
  }
}
