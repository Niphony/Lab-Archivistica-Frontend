server {
	listen 80;
	client_max_body_size 256M;
	server_name _;

	proxy_set_header Host $http_host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_redirect off;
	proxy_buffering off;
	proxy_read_timeout 172800s;

	# Storage service bajo prefijo secundario. La URI llega completa y el
	# SCRIPT_NAME del contenedor hace el stripping en la aplicacion.
	location /archivematica/storage-service/ {
		set $upstream_endpoint http://archivematica-storage-service:8000;
		proxy_pass $upstream_endpoint;
	}

	# Dashboard (incluye /archivematica/media/* via WhiteNoise)
	location / {
		set $upstream_endpoint http://archivematica-dashboard:8000;
		proxy_pass $upstream_endpoint;
	}
}
