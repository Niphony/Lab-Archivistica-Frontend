resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost labhumanidades.udistrital.edu.co;

    location / {
        set $astro_upstream http://astro-frontend:4321;
        proxy_pass $astro_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /orfeo/ {
        set $orfeo_upstream http://orfeo-nginx:80;
        proxy_pass $orfeo_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /orfeo-ng/ {
        set $orfeo_ng_upstream http://orfeo-nginx:80;
        proxy_pass $orfeo_ng_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

     location /dspace/ {
        set $dspace_upstream http://dspace-frontend:4000;
        proxy_pass $dspace_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $host;
   	proxy_set_header X-Forwarded-Port $server_port;
    	proxy_set_header X-Forwarded-Prefix /dspace;
    
    	proxy_http_version 1.1;
    	proxy_set_header Upgrade $http_upgrade;
    	proxy_set_header Connection 'upgrade';
    	proxy_cache_bypass $http_upgrade;
    }

     location /dspace/server/ {
       proxy_pass http://dspace:8080/server/;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
       proxy_set_header X-Forwarded-Host $host;
       proxy_set_header X-Forwarded-Port $server_port;
       proxy_set_header X-Forwarded-Prefix /dspace/server;

    # Ajustes de tiempo de espera y buffers para evitar cortes
    	proxy_read_timeout 600s;
    	proxy_send_timeout 600s;
    	client_max_body_size 100M;
    }

    # Compatibilidad con enlaces generados por instalaciones anteriores.
    location /server/ {
        proxy_pass http://dspace:8080/server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $host;
    }

    location /atom/ {
        # Sin "/" final en la URL: el prefijo /atom/ se conserva y
        # atom-nginx lo espera (SCRIPT_NAME=/atom/index.php)
        set $atom_upstream http://atom-nginx:80;
        proxy_pass $atom_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 72M;
    }

    # Assets compilados de AtoM: webpack los emite con publicPath fijo
    # "/dist" (no conoce el prefijo). Se reescriben internamente.
    location /dist/ {
        set $atom_upstream http://atom-nginx:80;
        rewrite ^/dist/(.*)$ /atom/dist/$1 break;
        proxy_pass $atom_upstream;
        proxy_set_header Host $host;
        expires 7d;
    }


    location /archivematica/ {
        # Sin "/" final: el prefijo llega completo a archivematica-nginx
        set $archivematica_upstream http://archivematica-nginx:80;
        proxy_pass $archivematica_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 256M;
    }

    # TEMPORAL: el frontend Vue de Archivematica construye URLs absolutas
    # (window.location.origin + "/api/...", etc.) y no conoce el prefijo.
    # Estas rutas las reenvian al dashboard; eliminar si Archivematica pasa
    # a un subdominio propio.
    location ~ ^/(?:api|status|filesystem|transfer|ingest|fpr|archival-storage)(?:/|$) {
        set $archivematica_upstream http://archivematica-nginx:80;
        rewrite ^/(.*)$ /archivematica/$1 break;
        proxy_pass $archivematica_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /exiftool/ {
        set $exiftool_upstream http://host.docker.internal:63003/;
        proxy_pass $exiftool_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tika/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/index.html =404;
    }

    location /tika/api/ {
        proxy_pass http://apache-tika:9998/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;
    }

    location /ng_backend/ {
        set $orfeo_api_upstream http://orfeo-nginx:80;
        proxy_pass $orfeo_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket/ {
        set $socket_upstream http://orfeo-nginx:80;
        proxy_pass $socket_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        set $socketio_upstream http://orfeo-nginx:80;
        proxy_pass $socketio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
