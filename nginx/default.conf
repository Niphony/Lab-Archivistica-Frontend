resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost labhumanidades.udistrital.edu.co;

    location / {
        set $astro_upstream http://astro-frontend:4321;
        proxy_pass $astro_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /orfeo/ {
        set $orfeo_upstream http://orfeo-nginx:80;
        proxy_pass $orfeo_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /orfeo-ng/ {
        set $orfeo_ng_upstream http://orfeo-nginx:80;
        proxy_pass $orfeo_ng_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dspace/ {
        set $dspace_upstream http://dspace-frontend:4000;
        proxy_pass $dspace_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dspace/server/ {
        proxy_pass http://dspace:8080/server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Compatibilidad con enlaces generados por instalaciones anteriores.
    location /server/ {
        proxy_pass http://dspace:8080/server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /atom/ {
        set $atom_upstream http://host.docker.internal:63001/;
        proxy_pass $atom_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /archivematica/ {
        set $archivematica_upstream http://host.docker.internal:63002/;
        proxy_pass $archivematica_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /exiftool/ {
        set $exiftool_upstream http://host.docker.internal:63003/;
        proxy_pass $exiftool_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tika/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/index.html =404;
    }

    location /tika/api/ {
        proxy_pass http://apache-tika:9998/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;
    }

    location /ng_backend/ {
        set $orfeo_api_upstream http://orfeo-nginx:80;
        proxy_pass $orfeo_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket/ {
        set $socket_upstream http://orfeo-nginx:80;
        proxy_pass $socket_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        set $socketio_upstream http://orfeo-nginx:80;
        proxy_pass $socketio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
